openapi: 3.0.3
info:
  title: Aurora Limits & Statements
  version: "1.0.0"
  description: |
    Müşteri bazlı transfer limitleri ve onaylanmış işlem dökümü.
    Para tutarları string, yanıtta her zaman 2 ondalıklıdır. Bkz. PRD-limits.md.
paths:
  /limits/{customer_id}:
    parameters:
      - $ref: "#/components/parameters/CustomerId"
    put:
      summary: Müşteri limitlerini tanımla veya güncelle
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LimitsInput" }
      responses:
        "200":
          description: Kaydedildi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Limits" }
        "422":
          $ref: "#/components/responses/ValidationError"
    get:
      summary: Limitleri getir (tanımlı değilse varsayılanlar)
      responses:
        "200":
          description: Limitler
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Limits" }
        "422":
          $ref: "#/components/responses/ValidationError"
  /limits/{customer_id}/authorize:
    parameters:
      - $ref: "#/components/parameters/CustomerId"
    post:
      summary: İşlemi limitlere göre yetkilendir; onaylanırsa kullanıma ve statement'a yaz
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthorizeInput" }
      responses:
        "200":
          description: Karar (onay veya red, ikisi de 200)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Decision" }
        "422":
          $ref: "#/components/responses/ValidationError"
  /statements/{customer_id}:
    parameters:
      - $ref: "#/components/parameters/CustomerId"
    get:
      summary: Tarih aralığındaki onaylanmış işlemler
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200":
          description: Döküm
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Statement" }
        "422":
          $ref: "#/components/responses/ValidationError"
components:
  parameters:
    CustomerId:
      name: customer_id
      in: path
      required: true
      schema: { type: string, pattern: "^C[0-9]{6}$" }
  responses:
    ValidationError:
      description: Geçersiz girdi
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    Money:
      type: string
      pattern: "^[0-9]+\\.[0-9]{2}$"
      example: "1500.00"
    LimitsInput:
      type: object
      required: [daily_limit, per_transfer_limit]
      properties:
        daily_limit: { type: string, description: "> 0, en fazla 2 ondalık. Ondalık kısım yazılmayabilir: \"1000\" geçerlidir ve yanıtta \"1000.00\" döner" }
        per_transfer_limit: { type: string, description: "> 0, <= daily_limit" }
    Limits:
      type: object
      properties:
        customer_id: { type: string }
        daily_limit: { $ref: "#/components/schemas/Money" }
        per_transfer_limit: { $ref: "#/components/schemas/Money" }
        source: { type: string, enum: [custom, default] }
    AuthorizeInput:
      type: object
      required: [amount, occurred_on]
      properties:
        amount: { type: string, description: "> 0, en fazla 2 ondalık. Ondalık kısım yazılmayabilir: \"10\" geçerlidir" }
        occurred_on: { type: string, format: date }
        description: { type: string, nullable: true }
    Decision:
      type: object
      properties:
        customer_id: { type: string }
        allowed: { type: boolean }
        reason:
          type: string
          nullable: true
          enum: [PER_TRANSFER_LIMIT_EXCEEDED, DAILY_LIMIT_EXCEEDED]
        remaining_daily:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: Karardan sonra o gün için kalan tutar
    Statement:
      type: object
      properties:
        customer_id: { type: string }
        from: { type: string, format: date }
        to: { type: string, format: date }
        entries:
          type: array
          items:
            type: object
            properties:
              occurred_on: { type: string, format: date }
              amount: { $ref: "#/components/schemas/Money" }
              description: { type: string, nullable: true }
        total: { $ref: "#/components/schemas/Money" }
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: VALIDATION_ERROR }
            message: { type: string }
